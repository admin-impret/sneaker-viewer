<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Gallery</title>
<meta name="description" content="Original stylized 3D models for the web. Drag to rotate, click to open full view.">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3/dist/model-viewer.min.js"></script>
<script src="models.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #262a33;
    color: #e8eaf0;
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: 0.2px; }
  header p { margin-top: 5px; font-size: 13px; color: #9aa3b5; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 20px 30px 34px;
  }
  .card {
    background: #2d323d;
    border: 1px solid #3a4152;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .stage { position: relative; aspect-ratio: 4 / 3; background: #22262e; }
  .card model-viewer { width: 100%; height: 100%; --poster-color: transparent; background: transparent; }
  .open-btn {
    position: absolute; right: 10px; bottom: 10px;
    font-size: 12px; color: #cfd5e2;
    background: rgba(20, 23, 30, 0.8);
    border: 1px solid #4a5268; border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .open-btn:hover { background: rgba(40, 46, 60, 0.95); }
  .meta { padding: 13px 16px 15px; }
  .meta h2 { font-size: 15px; font-weight: 600; }
  .meta .badge {
    display: inline-block; margin-top: 6px;
    font-size: 11px; color: #9fe3a8;
    border: 1px solid #3f6b47; border-radius: 999px; padding: 2px 9px;
  }
  .meta .credit {
    display: block; margin-top: 6px;
    font-size: 11px; color: #e8c07a;
    border: 1px solid #6b5a3f; border-radius: 8px; padding: 5px 9px;
    background: rgba(70, 58, 36, 0.25);
  }
  .meta p.desc { margin-top: 7px; font-size: 12.5px; color: #9aa3b5; line-height: 1.45; }
  /* full-view overlay */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(15, 17, 22, 0.92);
    display: none; flex-direction: column;
  }
  .overlay.open { display: flex; }
  .overlay-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
  }
  .overlay-bar h2 { font-size: 16px; font-weight: 600; flex: 1; }
  .overlay-bar .credit { font-size: 11.5px; color: #e8c07a; }
  .close-btn {
    font-size: 13px; color: #cfd5e2; cursor: pointer;
    background: #2d323d; border: 1px solid #4a5268;
    border-radius: 999px; padding: 7px 16px;
  }
  .overlay model-viewer { flex: 1; width: 100%; --poster-color: transparent; background: transparent; }
  .overlay .hint {
    text-align: center; padding: 10px 0 16px;
    font-size: 12.5px; color: #8b93a7;
  }
</style>
</head>
<body>
  <header>
    <h1>3D Model Gallery</h1>
    <p>Original stylized models, ready for real-time web. Drag any card to rotate; click Open for the full view.</p>
  </header>
  <div class="grid" id="grid"></div>

  <div class="overlay" id="overlay">
    <div class="overlay-bar">
      <h2 id="ovName"></h2>
      <span class="credit" id="ovCredit"></span>
      <button class="close-btn" id="ovClose">Close</button>
    </div>
    <model-viewer id="ovViewer" camera-controls auto-rotate rotation-per-second="24deg"
      shadow-intensity="0.9" shadow-softness="0.8" exposure="1.05"
      min-camera-orbit="auto auto 0.3m" max-camera-orbit="auto auto 2m"
      interpolation-decay="180" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
    <div class="hint">Drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan</div>
  </div>

<script>
(function () {
  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const ovViewer = document.getElementById('ovViewer');
  const ovName = document.getElementById('ovName');
  const ovCredit = document.getElementById('ovCredit');

  function makeCard(m) {
    const card = document.createElement('div');
    card.className = 'card';
    const stage = document.createElement('div');
    stage.className = 'stage';
    const mv = document.createElement('model-viewer');
    // lazy: only load the model when the card is near the viewport
    mv.setAttribute('loading', 'lazy');
    mv.setAttribute('reveal', 'interaction');
    mv.setAttribute('src', m.file);
    mv.setAttribute('alt', m.alt || m.name);
    mv.setAttribute('camera-controls', '');
    mv.setAttribute('shadow-intensity', '0.85');
    mv.setAttribute('exposure', '1.05');
    stage.appendChild(mv);
    const btn = document.createElement('button');
    btn.className = 'open-btn';
    btn.textContent = 'Open';
    btn.addEventListener('click', function () { openOverlay(m); });
    stage.appendChild(btn);
    card.appendChild(stage);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const h = document.createElement('h2');
    h.textContent = m.name;
    meta.appendChild(h);
    if (m.credit) {
      const c = document.createElement('span');
      c.className = 'credit';
      c.textContent = 'Credit: ' + m.credit;
      meta.appendChild(c);
    } else {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'Original model';
      meta.appendChild(b);
    }
    if (m.detail) {
      const p = document.createElement('p');
      p.className = 'desc';
      p.textContent = m.detail;
      meta.appendChild(p);
    }
    card.appendChild(meta);
    return card;
  }

  function openOverlay(m) {
    ovName.textContent = m.name;
    ovCredit.textContent = m.credit ? ('Credit: ' + m.credit) : 'Original model';
    ovViewer.setAttribute('src', m.file);
    ovViewer.setAttribute('alt', m.alt || m.name);
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeOverlay() {
    overlay.classList.remove('open');
    ovViewer.removeAttribute('src');
    document.body.style.overflow = '';
  }
  document.getElementById('ovClose').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOverlay(); });

  (window.MODELS || []).forEach(function (m) { grid.appendChild(makeCard(m)); });
})();
</script>
</body>
</html>
